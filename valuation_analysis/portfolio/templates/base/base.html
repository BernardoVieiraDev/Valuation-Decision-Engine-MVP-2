{% load static %}
<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Playbook{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
    <style>
        /* Layout base com Sidebar */
        body { display: block; margin: 0; background: var(--bg-dark); }
        .app-layout { display: flex; min-height: 100vh; width: 100%; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; flex-shrink: 0; }
        .sidebar-logo { font-size: 1.25rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2.5rem; padding-left: 0.5rem; }
        .sidebar-logo i { color: var(--primary); font-size: 1.5rem; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: all 0.2s; }
        .nav-item:hover { background: var(--bg-card); color: var(--text-main); }
        .nav-item.active { background: var(--primary); color: #ffffff; }
        .nav-item i { font-size: 1.25rem; }

        /* Conteúdo Principal */
        .main-content { min-width: 0; flex: 1; overflow-y: auto; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 0; }
        .top-header { text-align: left; margin-bottom: 2rem; }
        .top-header h1 { justify-content: flex-start; color: var(--text-main); font-size: 1.8rem; margin-bottom: 0.25rem; }
        a { text-decoration: none; }
    </style>
    <style>
      .btn-danger { color: var(--danger); border-color: var(--danger); }
      .actions-inline { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
      @media (max-width: 760px) {
        .app-layout { flex-direction: column; }
        .sidebar { width: 100%; padding: 1rem; border-right: 0; border-bottom: 1px solid var(--border); }
        .sidebar-logo { margin-bottom: .75rem; }
        .sidebar-nav { flex-direction: row; overflow-x: auto; }
        .nav-item { white-space: nowrap; }
        .main-content { padding: 1rem; }
      }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="ph ph-chart-line-up"></i> Playbook
            </div>
            <nav class="sidebar-nav">
                <a href="{% url 'simulador_aporte' %}" class="nav-item {% block nav_simulador %}{% endblock %}">
                    <i class="ph ph-wallet"></i> Aporte
                </a>

                <a href="{% url 'historico_aportes' %}" class="nav-item {% block nav_historico_aportes %}{% endblock %}">
                    <i class="ph ph-clock-counter-clockwise"></i> Histórico de Aportes
                </a>
        
                <a href="{% url 'gerenciar_ativos' %}" class="nav-item {% block nav_gerenciar_ativos %}{% endblock %}">
                    <i class="ph ph-list-plus"></i> Gerenciar Ativos
                </a>

<a href="{% url 'playbook_list' %}" class="nav-item {% block nav_playbook %}{% endblock %}">
    <i class="ph ph-book-open"></i> Playbook
</a>

                <a href="{% url 'configuracoes' %}" class="nav-item {% block nav_configuracoes %}{% endblock %}">
                    <i class="ph ph-gear"></i> Configurações
                </a>

                <a href="{% url 'panorama' %}" class="nav-item {% block nav_panorama %}{% endblock %}">
    <i class="ph ph-globe-hemisphere-west"></i> Panorama
</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
